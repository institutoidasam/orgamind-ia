# ★ SEGREDO NO ACCESS LOG (achado C20, 2026-08-19) — 74 linhas de produção em
# 52h com o token do webhook do GoZap em texto claro.
#
# O GoZap não assina o corpo: a ÚNICA defesa de /api/webhooks/gozap é o segredo
# `GOZAP_WEBHOOK_TOKEN`, e ele chega na URL (`?t=<48 hex>`) porque foi assim que
# a URL foi gravada no painel do SaaS. O formato `combined` loga `$request`, que
# é a linha de requisição INTEIRA — query junto. Resultado: quem lê o log do
# contêiner `web` (a API do Dokploy, por exemplo) sai de lá podendo forjar ack
# de entrega e opt-out de eleitor.
#
# Este `log_format` é o mesmo `combined` com UMA troca: `$request` vira
# `$request_method $log_path $server_protocol`, ou seja, o caminho SEM a query.
# Continua havendo linha de log (IP, verbo, rota, status, bytes, user-agent) —
# `access_log off` teria apagado a única evidência de que o GoZap chama mesmo.
#
# Onde ele pode morar: este arquivo vai para /etc/nginx/conf.d/default.conf
# (frontend/Dockerfile:16) e o nginx.conf da imagem o inclui DENTRO de `http`.
# Logo, aqui fora do `server` é contexto http — que é exatamente o contexto que
# `log_format` exige. (Dentro do `server` seria erro de boot: "log_format"
# directive is not allowed here.)
log_format redacted_query '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $log_path $server_protocol" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ★ INCIDENTE 2026-08-12 — 20h de produção fora do ar, todo /api/ em 502.
  #
  # Com um hostname LITERAL em `proxy_pass` (`http://api:3000/`), o nginx
  # resolve `api` UMA vez, ao carregar a config, e guarda o IP para sempre.
  # Um deploy que mexe só no backend recria a api (IP novo) e deixa o `web`
  # de pé — e o nginx segue batendo no endereço morto até alguém reiniciá-lo.
  # Foi exatamente isso: `web` no ar desde as 16h, `api` recriada às 20h,
  # `connect() failed (111: Connection refused) upstream: 172.16.2.4:3000`
  # em cada requisição pelas 20 horas seguintes.
  #
  # A cura é resolver em tempo de REQUISIÇÃO: com uma VARIÁVEL em
  # `proxy_pass`, o nginx passa a consultar este `resolver` a cada `valid=`.
  # 127.0.0.11 é o DNS embutido do Docker, presente em qualquer rede
  # definida pelo usuário — que é como este contêiner sempre roda (compose).
  # `ipv6=off` porque o backend só escuta em IPv4 e uma resposta AAAA vazia
  # custaria uma consulta a cada request.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Live chat SSE stream: must not be buffered or gzipped, and needs a long
  # read timeout (the stream has no heartbeat, so the default 60s would drop
  # idle connections). Longest-prefix match wins, so this beats /api/ for the
  # stream path only. Dev is unaffected (it uses vite's proxy, not nginx).
  location /api/chat/stream {
    # `rewrite ... break` + `proxy_pass` SEM URI: quando há variável no
    # `proxy_pass`, o nginx NÃO faz a troca automática do prefixo da location
    # (um `/chat/stream` literal ali seria enviado como está, para qualquer
    # request). Reescrever antes e deixar o `proxy_pass` sem caminho preserva
    # o roteamento — e a query string vem junto, porque a substituição não
    # contém `?`.
    set $api_upstream api;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    gzip off;
  }

  # Webhooks de PROVEDOR: a query string NÃO vai para o access log.
  #
  # Vale para o prefixo inteiro, não só para o GoZap: a rota de verificação da
  # Meta (`/api/webhooks/whatsapp?hub.verify_token=…`) carrega o mesmo tipo de
  # segredo na URL, e é a mesma classe de vazamento que o
  # `sanitizeReqForLog` do backend já trata do lado da aplicação
  # (backend/src/shared/logging/pino-req-serializer.ts). Nenhuma rota de
  # webhook precisa da query no log — o diagnóstico (quem chamou, qual rota,
  # que status) está todo aqui, e o conteúdo do evento é do backend.
  #
  # `set $log_path $uri;` ANTES do `rewrite`: `$uri` é reescrito pelo `rewrite`
  # abaixo, e o access log é avaliado no FIM da requisição — sem capturar antes,
  # o log mostraria `/webhooks/gozap` em vez de `/api/webhooks/gozap`.
  #
  # `client_max_body_size` é repetido de propósito: o 16m do `location /api/`
  # NÃO é herdado por uma location irmã (a herança é de http→server→location),
  # e um webhook de mídia estouraria no default de 1m com 413.
  #
  # E `rewrite ... break` também é repetido de propósito — com variável no
  # `proxy_pass` o nginx não troca o prefixo da location sozinho. É a armadilha
  # documentada no comentário de /api/chat/stream logo acima; sem a linha, o
  # backend receberia `/api/webhooks/gozap` e devolveria 404 em TODO evento.
  # E o ERROR log, que é a outra metade do vazamento: ele grava a LINHA DE
  # REQUISIÇÃO INTEIRA (`request: "POST /api/webhooks/gozap?t=<segredo> …"`) e
  # NÃO é formatável — `log_format` só vale para o access log. No apagão de
  # 2026-08-12 foram 20h com toda requisição em erro, ou seja, 20h escrevendo o
  # segredo em texto claro no stdout do contêiner `web`. Subir o nível para
  # `crit` cala as mensagens de nível `error` DESTA location — que são
  # justamente as de upstream fora do ar, as únicas que aparecem em rajada.
  #
  # Não se perde diagnóstico: (a) o access log acima continua registrando cada
  # requisição desta rota com o status, então uma rajada de 502 aqui continua
  # visível; e (b) o MOTIVO do 502 segue sendo logado normalmente pela
  # `location /api/`, que fala com o MESMO upstream `api` — um apagão que
  # atinge os webhooks atinge o resto da API junto.
  location /api/webhooks/ {
    access_log /var/log/nginx/access.log redacted_query;
    error_log /var/log/nginx/error.log crit;
    client_max_body_size 16m;
    set $api_upstream api;
    set $log_path $uri;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    client_max_body_size 16m;
    set $api_upstream api;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
